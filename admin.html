<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de administración · Yose Barber</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080808'/%3E%3Cpath d='M10 44l-3-22 13 10 12-18 12 18 13-10-3 22z' fill='%23D6A64B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand"><strong>YOSE BARBER</strong><span>Panel de administración</span></div>

    <div class="topbar__devices" role="group" aria-label="Tamaño de la vista previa">
      <button type="button" data-device="100%" class="is-active">Escritorio</button>
      <button type="button" data-device="820px">Tablet</button>
      <button type="button" data-device="390px">Móvil</button>
    </div>

    <div class="topbar__actions">
      <span class="status" id="status" aria-live="polite"></span>
      <button type="button" class="btn" id="btn-import">Importar</button>
      <button type="button" class="btn" id="btn-reset">Restaurar publicado</button>
      <button type="button" class="btn btn--gold" id="btn-download">Descargar site-config.js</button>
      <input type="file" id="file-import" accept=".js,.json,.txt" hidden>
    </div>
  </header>

  <div class="layout">
    <aside class="panel" id="panel">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones del panel"></nav>
      <div class="panel__body" id="panel-body">
        <p class="muted" id="loading">Cargando la web…</p>
      </div>
    </aside>

    <main class="preview" id="preview">
      <div class="preview__frame" id="frame-wrap">
        <iframe id="frame" title="Vista previa de la web" src="index.html?preview=1"></iframe>
      </div>
    </main>
  </div>

  <button type="button" class="fab" id="fab" aria-label="Alternar entre panel y vista previa">Vista previa</button>

  <script src="admin.js"></script>
</body>
</html>
